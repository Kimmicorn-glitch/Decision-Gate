apiVersion: 2022-03-01
location: eastus
name: agent-decision-gate
properties:
  managedEnvironmentId: /subscriptions/<SUB_ID>/resourceGroups/<RG>/providers/Microsoft.App/managedEnvironments/<ENV>
  configuration:
    ingress:
      external: true
      targetPort: 8080
    registries:
      - server: <ACR_NAME>.azurecr.io
        username: <ACR_USER>
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: <ACR_PASSWORD>
      - name: mcp-base-url
        value: https://<FUNCTION_APP>.azurewebsites.net
      - name: admin-username
        value: <ADMIN_USERNAME>
      - name: admin-password
        value: <ADMIN_PASSWORD>
      - name: tenant-encryption-key
        value: <TENANT_ENCRYPTION_KEY>
  template:
    containers:
      - image: <ACR_NAME>.azurecr.io/agent-decision-gate:latest
        name: decision-gate
        env:
          - name: BIND_ADDR
            value: 0.0.0.0:8080
          - name: MCP_BASE_URL
            secretRef: mcp-base-url
          - name: MCP_LOGGING_PATH
            value: /api/mcp/log-decision
          - name: ADMIN_USERNAME
            secretRef: admin-username
          - name: ADMIN_PASSWORD
            secretRef: admin-password
          - name: TENANT_ENCRYPTION_KEY
            secretRef: tenant-encryption-key
          - name: ADMIN_USERS_FILE
            value: /app/data/admin_users.json
          - name: TENANT_SETTINGS_FILE
            value: /app/data/tenant_settings.sec.json
        probes:
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8080
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8080
        resources:
          cpu: 1.0
          memory: 2Gi
    scale:
      minReplicas: 1
      maxReplicas: 3
