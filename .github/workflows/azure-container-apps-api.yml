# Azure Container Apps Workflow

# This workflow deploys the .NET API to Azure Container Apps with error handling

name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release

      - name: Test the project
        run: dotnet test

      - name: Publish the project
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v1
        with:
          args: |
            az containerapp deploy --name my-app --resource-group my-resource-group --image my-image:latest --environment my-environment

          # Error handling and OIDC configuration
          if: failure()
          run: |
            echo "Error: Failed to deploy. Check the logs for details."
            exit 1

            # OIDC authentication with fallback
            if [ -z "$OIDC_TOKEN" ]; then
              echo "OIDC token is not set. Falling back to connection string."
              export CONNECTION_STRING="$AZURE_CONNECTION_STRING"
            else
              echo "Using OIDC token for authentication."
            fi
      
      - name: Validate secrets
        run: |
          if [ -z "$AZURE_CONNECTION_STRING" ]; then
            echo "Error: Connection string is not set."
            exit 1
          fi
          echo "Secrets validated successfully!"
