policies:
  - id: "POL-PRIV-001"
    severity: "critical"
    field: "description"
    condition: "contains"
    value: "elevated permissions"
    message: "Elevated permissions in production require security approval workflow."

  - id: "POL-RISK-001"
    severity: "high"
    field: "execution.detected_risks"
    condition: "equals"
    value: "privilege_escalation"
    message: "Privilege escalation signal detected during execution simulation."

  - id: "POL-DEPLOY-001"
    severity: "medium"
    field: "description"
    condition: "contains"
    value: "production"
    message: "Production deployments must include rollback and approval metadata."

  - id: "POL-RISK-002"
    severity: "high"
    field: "risk_level"
    condition: "equals"
    value: "high"
    message: "High risk requests require revision and explicit mitigations."

  - id: "POL-PROMPT-001"
    severity: "critical"
    field: "description"
    condition: "contains"
    value: "ignore previous instructions"
    message: "Prompt-injection marker detected: instruction override attempt."

  - id: "POL-PROMPT-002"
    severity: "critical"
    field: "description"
    condition: "contains"
    value: "jailbreak"
    message: "Prompt-injection marker detected: jailbreak phrasing."

  - id: "POL-PROMPT-003"
    severity: "high"
    field: "description"
    condition: "contains"
    value: "system prompt"
    message: "Sensitive prompt-surface reference requires revision."

  - id: "POL-TOKEN-001"
    severity: "high"
    field: "description"
    condition: "contains"
    value: "again and again"
    message: "Potential token-waste loop pattern detected."

  - id: "POL-TOKEN-002"
    severity: "high"
    field: "description"
    condition: "contains"
    value: "loop forever"
    message: "Unbounded loop request blocked to prevent runaway token usage."

  - id: "POL-HARM-001"
    severity: "critical"
    field: "description"
    condition: "contains_any"
    value: "hide a malicious bug|malicious bug|backdoor|malware|ransomware|trojan|keylogger|spyware|evade detection|avoid detection|credential theft|steal credentials|exfiltrate data|lateral movement|persistence"
    message: "Malicious, stealthy, or unauthorized offensive behavior is disallowed."

  - id: "POL-HARM-002"
    severity: "critical"
    field: "description"
    condition: "contains_any"
    value: "bypass authentication|disable authentication|remove audit log|disable logging|disable guardrail|disable policy|hide traces"
    message: "Requests to bypass controls, hide traces, or remove safeguards are blocked."

  - id: "POL-HARM-003"
    severity: "critical"
    field: "description"
    condition: "contains_any"
    value: "drop database|delete all records|wipe production|rm rf|destroy backups|self propagate"
    message: "Destructive or self-propagating actions require hard block."
